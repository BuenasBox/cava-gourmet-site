<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Enofilios Cava">
  <title>Mi tarjeta · Enofilios Cava</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,ital,wght@6..96,0,300;6..96,1,300&family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --ivory:#f6efe3;--gold:#b8975a;--gold-soft:#d7b879;
      --navy:#091522;--charcoal:#12100d;
      --line:rgba(184,151,90,.2);--muted:rgba(246,239,227,.45);
      --display:"Bodoni Moda",Georgia,serif;
      --serif:"Cormorant Garamond",Georgia,serif;
      --sans:"Jost",system-ui,sans-serif;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{background:var(--charcoal);color:var(--ivory);font-family:var(--sans);font-weight:300;line-height:1.7;-webkit-font-smoothing:antialiased;min-height:100vh}

    /* LOADING / ERROR */
    .state{display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:2rem;flex-direction:column;gap:1rem}
    .state-icon{font-size:2rem;color:var(--gold)}
    .state-msg{font-family:var(--serif);font-style:italic;font-size:1rem;color:var(--muted)}

    /* LAYOUT */
    .page{max-width:420px;margin:0 auto;padding:0 0 5rem}

    /* HEADER */
    .site-header{display:flex;flex-direction:column;align-items:center;padding:2rem 1.5rem 1.25rem;gap:.6rem}
    .site-logo{height:36px;width:auto;mix-blend-mode:screen}
    .site-tagline{font-size:.56rem;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}

    /* HERO */
    .hero{text-align:center;padding:1.5rem 1.5rem 0}
    .member-name{font-family:var(--display);font-style:italic;font-weight:300;font-size:2rem;color:var(--gold-soft);line-height:1.1;margin-bottom:.75rem}
    .nivel-badge{display:inline-block;border:1px solid rgba(184,151,90,.5);color:var(--gold-soft);font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;padding:.35rem 1rem;border-radius:3px;margin-bottom:.5rem}
    .member-since{font-size:.7rem;color:var(--muted);letter-spacing:.08em}

    /* STATS */
    .stats{text-align:center;padding:2rem 1.5rem 1.5rem}
    .exp-num{font-family:var(--display);font-size:4.5rem;font-weight:300;color:var(--gold);line-height:1}
    .exp-label{font-size:.56rem;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);margin-top:.2rem;margin-bottom:1.5rem}
    .progress-wrap{background:rgba(255,255,255,.06);border-radius:100px;height:4px;margin-bottom:.85rem;overflow:hidden}
    .progress-bar{height:4px;background:linear-gradient(90deg,var(--gold),var(--gold-soft));border-radius:100px;transition:width .8s cubic-bezier(.22,.61,.36,1)}
    .progress-label{font-family:var(--serif);font-style:italic;font-size:.92rem;color:rgba(246,239,227,.65)}

    /* DIVIDER */
    .divider{width:40px;height:1px;background:var(--line);margin:1.75rem auto}

    /* QR */
    .qr-section{text-align:center;padding:0 1.5rem}
    .qr-title{font-size:.58rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin-bottom:1rem}
    .qr-wrap{display:inline-block;background:#fff;padding:12px;border-radius:10px;line-height:0}
    .qr-wrap img{width:200px;height:200px;display:block}
    .qr-hint{font-size:.7rem;color:var(--muted);margin-top:.85rem;line-height:1.5}

    /* BENEFITS */
    .benefits-section{padding:0 1.5rem}
    .section-label{font-size:.58rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);display:flex;align-items:center;gap:.6rem;margin-bottom:1rem}
    .section-label::before{content:"";width:20px;height:1px;background:currentColor;opacity:.7}
    .benefit-item{display:flex;align-items:flex-start;gap:.75rem;padding:.6rem 0;border-bottom:1px solid rgba(255,255,255,.05)}
    .benefit-item:last-child{border-bottom:none}
    .benefit-dot{width:6px;height:6px;border-radius:50%;background:var(--gold);flex-shrink:0;margin-top:.55rem}
    .benefit-text{font-size:.82rem;color:rgba(246,239,227,.8);line-height:1.5}

    /* PROMO */
    .promo-section{margin:1.5rem 1.5rem 0;background:rgba(184,151,90,.06);border:1px solid rgba(184,151,90,.3);border-radius:10px;padding:1rem 1.1rem}
    .promo-label{font-size:.55rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:.4rem}
    .promo-text{font-family:var(--serif);font-size:.95rem;color:var(--ivory);line-height:1.5}

    /* CTA */
    .cta-section{padding:2rem 1.5rem 0;display:flex;flex-direction:column;gap:.75rem}
    .btn{display:flex;align-items:center;justify-content:center;gap:.6rem;width:100%;border:1px solid transparent;border-radius:7px;font-family:var(--sans);font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;font-weight:400;padding:.9rem 1.25rem;cursor:pointer;text-decoration:none;transition:all .25s}
    .btn-gold{background:var(--gold);color:var(--navy);border-color:var(--gold)}
    .btn-gold:hover{background:var(--gold-soft);border-color:var(--gold-soft)}
    .btn-ghost{background:transparent;color:var(--gold-soft);border-color:rgba(184,151,90,.4)}
    .btn-ghost:hover{background:rgba(184,151,90,.07);border-color:var(--gold)}
    .btn svg{width:15px;height:15px;flex-shrink:0}

    /* FOOTER */
    .site-footer{text-align:center;padding:2.5rem 1.5rem 1rem;font-size:.56rem;letter-spacing:.18em;text-transform:uppercase;color:rgba(246,239,227,.2)}

    /* PRINT */
    @media print {
      body{background:#fff;color:#12100d}
      .site-header,.cta-section,.site-footer{display:none}
      .page{max-width:100%;padding:0}
      .hero{padding:1rem}
      .member-name{color:#b8975a}
      .nivel-badge{border-color:#b8975a;color:#b8975a}
      .stats{padding:1rem}
      .exp-num{color:#b8975a}
      .progress-wrap{background:#e0d9ce}
      .progress-label,.member-since,.exp-label,.qr-hint,.section-label,.benefit-text{color:#555}
      .benefit-dot{background:#b8975a}
      .promo-section{border-color:#b8975a;background:#f9f5ee}
      .divider{background:#b8975a}
      .qr-wrap{border:1px solid #ddd}
    }
  </style>
</head>
<body>

<div id="loading" class="state">
  <div class="state-icon">🍷</div>
  <div class="state-msg">Cargando tu tarjeta…</div>
</div>

<div id="error" class="state" style="display:none">
  <div class="state-icon">⚠</div>
  <div id="error-msg" class="state-msg">Link inválido o expirado.</div>
</div>

<div id="app" style="display:none">
  <div class="page">

    <header class="site-header">
      <img src="/Assets/Logo-Cava.png" alt="CAVA Vinoteca" class="site-logo">
      <span class="site-tagline">Enofilios Cava</span>
    </header>

    <section class="hero">
      <h1 id="member-name" class="member-name"></h1>
      <div id="nivel-badge" class="nivel-badge"></div>
      <div id="member-since" class="member-since"></div>
    </section>

    <section class="stats">
      <div id="exp-num" class="exp-num"></div>
      <div class="exp-label">experiencias</div>
      <div class="progress-wrap">
        <div id="progress-bar" class="progress-bar" style="width:0%"></div>
      </div>
      <div id="progress-label" class="progress-label"></div>
    </section>

    <div class="divider"></div>

    <section class="qr-section">
      <p class="qr-title">Tu código de visita</p>
      <div class="qr-wrap">
        <img id="qr-img" src="" alt="QR Enofilios Cava" loading="lazy">
      </div>
      <p class="qr-hint">Muestra este código en cada visita.<br>El anfitrión lo escaneará para registrarte.</p>
    </section>

    <div class="divider"></div>

    <section class="benefits-section">
      <p class="section-label">Tus beneficios</p>
      <div id="benefits-list"></div>
    </section>

    <div id="promo-wrap" style="display:none">
      <div class="promo-section">
        <div class="promo-label">Promoción activa</div>
        <div id="promo-text" class="promo-text"></div>
      </div>
    </div>

    <section class="cta-section">
      <a id="btn-wallet" href="#" target="_blank" rel="noopener noreferrer" class="btn btn-gold" style="display:none">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>
        Agregar a Google Wallet
      </a>
      <button id="btn-pdf" onclick="window.print()" class="btn btn-ghost" style="display:none">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Descargar tarjeta PDF
      </button>
    </section>

    <footer class="site-footer">
      CAVA Vinoteca &middot; Pérez Zeledón, Costa Rica
    </footer>

  </div>
</div>

<script>
  const BENEFICIOS = {
    invitado:   ["Acceso al grupo WhatsApp de CAVA"],
    neofito:    ["Acceso al After Office", "Lugar asegurado en la mesa aunque esté lleno"],
    entusiasta: ["Ingreso al Club Enofilios", "Cajas de vino mensuales — 3 vinos, selección de Nazareth"],
    enofilo:    [] // se carga desde /api/config
  };

  function nivelKey(nivel) {
    if (nivel.includes("Enófilo"))    return "enofilo";
    if (nivel.includes("Entusiasta")) return "entusiasta";
    if (nivel.includes("Neófito"))    return "neofito";
    return "invitado";
  }

  function getBeneficiosActivos(nivelK, beneficioEnofilo) {
    const lista = [...BENEFICIOS.invitado];
    if (["neofito","entusiasta","enofilo"].includes(nivelK))
      lista.push(...BENEFICIOS.neofito);
    if (["entusiasta","enofilo"].includes(nivelK))
      lista.push(...BENEFICIOS.entusiasta);
    if (nivelK === "enofilo" && beneficioEnofilo)
      lista.push(beneficioEnofilo);
    return lista;
  }

  function calcularProgreso(exp, esEnofilo) {
    if (esEnofilo)  return {pct: 100, texto: "Parte del círculo interno de CAVA."};
    if (exp >= 25)  return {pct: 100, texto: "Candidato a Enófilo — pendiente de invitación."};
    if (exp >= 10)  return {pct: Math.round(((exp-10)/15)*100), texto: `Faltan ${25-exp} experiencias para Enófilo 🔐`};
    if (exp >= 3)   return {pct: Math.round(((exp-3)/7)*100),   texto: `Faltan ${10-exp} para Entusiasta 🍷`};
    return          {pct: Math.round((exp/3)*100),               texto: `Faltan ${3-exp} para Neófito 🌱`};
  }

  async function init() {
    const params   = new URLSearchParams(location.search);
    const t        = params.get("t") || "";
    const email    = params.get("e") || "";

    if (!t || !email) { showError("Link inválido. Solicita un nuevo link al equipo CAVA."); return; }

    try {
      const [memberRes, configRes] = await Promise.all([
        fetch(`/api/member?t=${encodeURIComponent(t)}&e=${encodeURIComponent(email)}`),
        fetch("/api/config")
      ]);

      const member = await memberRes.json();
      if (!member.ok) { showError(member.error || "No se pudo cargar tu tarjeta."); return; }

      const cfg    = await configRes.json();
      const config = cfg.config || {};

      render(member, config);
    } catch(e) {
      showError("Error de conexión. Intenta de nuevo.");
    }
  }

  function render(m, config) {
    const nivelK           = nivelKey(m.nivel);
    const progreso         = calcularProgreso(m.experiencias, m.es_enofilo);
    const beneficioEnofilo = config.beneficio_enofilo || "";
    const promoActiva      = config.promocion_activa  || "";
    const isIOS            = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

    document.getElementById("member-name").textContent  = m.nombre;
    document.getElementById("nivel-badge").textContent  = m.nivel;
    document.getElementById("member-since").textContent = m.fecha_ingreso ? "Miembro desde " + m.fecha_ingreso : "";
    document.getElementById("exp-num").textContent      = m.experiencias;
    document.getElementById("progress-label").textContent = progreso.texto;

    // Progress bar (delayed for CSS transition)
    setTimeout(() => {
      document.getElementById("progress-bar").style.width = progreso.pct + "%";
    }, 200);

    // QR
    const qrData = encodeURIComponent(m.scan_url);
    document.getElementById("qr-img").src =
      `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${qrData}&margin=8`;

    // Benefits
    const beneficios = getBeneficiosActivos(nivelK, beneficioEnofilo);
    document.getElementById("benefits-list").innerHTML = beneficios.map(b =>
      `<div class="benefit-item"><div class="benefit-dot"></div><div class="benefit-text">${b}</div></div>`
    ).join("");

    // Promo
    if (promoActiva) {
      document.getElementById("promo-text").textContent = promoActiva;
      document.getElementById("promo-wrap").style.display = "block";
    }

    // CTA: Android → Google Wallet / iOS → PDF
    if (isIOS) {
      document.getElementById("btn-pdf").style.display = "flex";
    } else {
      const btnWallet = document.getElementById("btn-wallet");
      btnWallet.href  = m.wallet_url;
      btnWallet.style.display = "flex";
    }

    document.getElementById("loading").style.display = "none";
    document.getElementById("app").style.display     = "block";
  }

  function showError(msg) {
    document.getElementById("loading").style.display  = "none";
    document.getElementById("error-msg").textContent  = msg;
    document.getElementById("error").style.display    = "flex";
  }

  init();
</script>
</body>
</html>
